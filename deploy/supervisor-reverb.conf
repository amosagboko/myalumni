[program:myalumni-reverb]
process_name=%(program_name)s
command=php /var/www/myalumni/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/myalumni
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/myalumni/storage/logs/reverb.log
stopwaitsecs=3600
